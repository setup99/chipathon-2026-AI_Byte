# Full-chip Chip flow — Crispi-style hierarchical integration.
#
# Step 1: harden the digital core (Classic):
#   make librelane-core   →  final_core/{gds,lef,nl,lib}/ai_byte_top.*
# Step 2: place that macro inside the workshop padring:
#   SLOT=workshop make librelane
#
# Padframe RTL only (chip_top + chip_core). AI_BYTE RTL is NOT re-synthesized;
# LibreLane blackboxes `ai_byte_top` from final_core views under MACROS.
#
# Flat (re-synth everything) path kept as: config_flat.yaml + make librelane-flat

meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top

# Padframe + pad adapter only. Do NOT list src/ai_byte/*.v here.
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

VDD_NETS:
- VDD
GND_NETS:
- VSS

IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Match hardened core (config_ai_byte_core.yaml).
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 140

PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Chip-top stdcell density (glue + pad logic only; bulk is the macro)
PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true

# Leave DRT_OPT_ITERS / DRT_ANTENNA_REPAIR_ITERS unset so LibreLane
# uses defaults and can iterate until DRC is clean.
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
# Align chip M4/M5 straps with final_core LEF power pins when macro is at
# [500,500] (core origin 442): pin x0=23.9 → 500+23.9-442=81.9; y0=25.91 → 83.91.
PDN_VOFFSET: 81.9
PDN_HOFFSET: 83.91

PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

ERROR_ON_MAGIC_DRC: False

MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

MAGIC_EXT_UNIQUE: notopports

# ---------------------------------------------------------------------------
# Hardened AI_BYTE core macro (from make librelane-core → final_core/)
# Instance hierarchy: chip_top.i_chip_core.u_ai_byte
# Placement: SW of workshop core (~442..2493 µm). Macro die ~1100×1100 µm.
# ---------------------------------------------------------------------------
MACROS:
  ai_byte_top:
    gds:
      - dir::../final_core/gds/ai_byte_top.gds
    lef:
      - dir::../final_core/lef/ai_byte_top.lef
    # Empty port stub for lint/synth blackbox — do NOT point at nl/*.nl.v
    # (Verilator would parse ~70k gates and hang for hours).
    vh:
      - dir::../final_core/vh/ai_byte_top.vh
    lib:
      nom_tt_025C_5v00:
        - dir::../final_core/lib/nom_tt_025C_5v00/ai_byte_top__nom_tt_025C_5v00.lib
      nom_ss_125C_4v50:
        - dir::../final_core/lib/nom_ss_125C_4v50/ai_byte_top__nom_ss_125C_4v50.lib
      nom_ff_n40C_5v50:
        - dir::../final_core/lib/nom_ff_n40C_5v50/ai_byte_top__nom_ff_n40C_5v50.lib
      min_tt_025C_5v00:
        - dir::../final_core/lib/min_tt_025C_5v00/ai_byte_top__min_tt_025C_5v00.lib
      min_ss_125C_4v50:
        - dir::../final_core/lib/min_ss_125C_4v50/ai_byte_top__min_ss_125C_4v50.lib
      min_ff_n40C_5v50:
        - dir::../final_core/lib/min_ff_n40C_5v50/ai_byte_top__min_ff_n40C_5v50.lib
      max_tt_025C_5v00:
        - dir::../final_core/lib/max_tt_025C_5v00/ai_byte_top__max_tt_025C_5v00.lib
      max_ss_125C_4v50:
        - dir::../final_core/lib/max_ss_125C_4v50/ai_byte_top__max_ss_125C_4v50.lib
      max_ff_n40C_5v50:
        - dir::../final_core/lib/max_ff_n40C_5v50/ai_byte_top__max_ff_n40C_5v50.lib
    instances:
      i_chip_core.u_ai_byte:
        location: [500, 500]
        orientation: N

  gf180mcu_ws_ip__id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
    instances:
      chip_id:
        location: [26, 26]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
        orientation: N

# Connect chip PDN straps to the hardened core power pins
PDN_MACRO_CONNECTIONS:
- ".*u_ai_byte.* VDD VSS VDD VSS"

# LEF Metal2 OBS overhangs ~18 µm past the macro box — keep routes clear.
FP_MACRO_HORIZONTAL_HALO: 30
FP_MACRO_VERTICAL_HALO: 30
# Small PDN halo so aligned M4/M5 straps can meet pin overhangs (~16 µm).
PDN_HORIZONTAL_HALO: 2
PDN_VERTICAL_HALO: 2

PDN_CFG: dir::pdn_cfg.tcl
