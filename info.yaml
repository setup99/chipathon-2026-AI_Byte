# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "A Reconfigurable AI and Mathematical Expression Accelerator for Edge Inference"
  team: "AI_Byte"                 # update if the official team name differs
  discord: ""                     # optional Discord handle
  description: >
    Lightweight edge AI / math accelerator (systolic CNN tiles,
    Q8.8 ALU, EML elementary functions) with 8-bit host MMIF on GF180MCU.
  # Relative path from repository root:
  lvs_config: "lvs_config.json"

# ======================================================
# External pad connections (organizer DEF / padframe integrate)
# ======================================================
# Names match ai_byte_top LEF pins (140 ns signoff run).
# Order: UL quadrant, clockwise bottom-left → upper-right, aligned
# with core edges for shorter pad↔core routes:
#   VDD + clk (west) first, then north-edge signals west→east.
# Ground omitted — common ground in the padframe.
# Outputs use bidirectional (no dedicated output io_type).
# Optional status/debug pins kept (done_o, error_o, debug_state).
# ======================================================
pins:
  - { name: VDD,            io_type: power }
  - { name: clk,            io_type: input_cmos }
  - { name: data[7],        io_type: bidirectional }
  - { name: data[5],        io_type: bidirectional }
  - { name: data[6],        io_type: bidirectional }
  - { name: data[4],        io_type: bidirectional }
  - { name: data[0],        io_type: bidirectional }
  - { name: data[1],        io_type: bidirectional }
  - { name: data[2],        io_type: bidirectional }
  - { name: data[3],        io_type: bidirectional }
  - { name: addr[0],        io_type: input_cmos }
  - { name: addr[1],        io_type: input_cmos }
  - { name: addr[2],        io_type: input_cmos }
  - { name: addr[3],        io_type: input_cmos }
  - { name: irq,            io_type: bidirectional }
  # Removable if pad budget is only 22 pins:
  # done/error are also in the MMIF status register (CPU-readable); keep debug_state on pads.
  - { name: error_o,        io_type: bidirectional }  # omit first if short on pads
  - { name: re,             io_type: input_cmos }
  - { name: done_o,         io_type: bidirectional }  # omit with error_o if short on pads
  - { name: debug_state[0], io_type: bidirectional }
  - { name: debug_state[2], io_type: bidirectional }
  - { name: debug_state[1], io_type: bidirectional }
  - { name: we,             io_type: input_cmos }
  - { name: rst_n,          io_type: input_schmitt }
