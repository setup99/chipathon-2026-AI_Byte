# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "A Reconfigurable AI and Mathematical Expression Accelerator for Edge Inference"
  team: "AI_Byte"
  discord: ""
  description: >
    Lightweight edge AI / math accelerator (systolic CNN tiles,
    Q8.8 ALU, EML elementary functions) with 8-bit host MMIF on GF180MCU.
    Tapeout block: A02_A user macro (1110×1110 µm, D10-style organizer DEF).
  lvs_config: "lvs_config.json"

# ======================================================
# External pad connections (organizer DEF / padframe integrate)
# ======================================================
# Top cell: A02_A — 146 Metal2 abutment pins per organizer A02_A.def
# (librelane/floorplan/A02_A_full.def). Order matches DEF pin list.
#
# Functional package pins (22) are a subset: VSS, VDD, clk, data[7:0],
# addr[3:0], irq, re, debug_state[2:0], we, rst_n — see A02_A_pad_map.yaml.
# Pad-control glue (_PU/_PD/_CS/_SL/_IE/_OE/_OUT/_PDRV*) uses bidirectional
# io_type (no dedicated output type in Chipathon schema).
#
# Signoff: docs/signoff_a02_macro/README.md
# ======================================================
pins:
  - name: VSS
    io_type: ground
  - name: VDD
    io_type: power
  - name: clk_PU
    io_type: bidirectional
