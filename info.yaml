# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "A Reconfigurable AI and Mathematical Expression Accelerator for Edge Inference"
  team: "AI_Byte"
  discord: ""
  description: >
    Lightweight edge AI / math accelerator (systolic CNN tiles,
    Q8.8 ALU, EML elementary functions) with 8-bit host MMIF on GF180MCU.
    Tapeout block: A02_A user macro (1110×1110 µm, D10-style organizer DEF).
  lvs_config: "lvs_config.json"

# ======================================================
# External pad connections (organizer DEF / padframe integrate)
# ======================================================
# ONE entry per I/O pad cell (22 pads), not per Metal2 abutment net.
# Layout top A02_A exposes 146 abutment pins in DEF; pad-control glue
# (_PU/_PD/_CS/_SL/_IE/_OE/_OUT/_PDRV*) is internal to the macro wrapper.
#
# Order matches A02_A_pad_map.yaml (UL quadrant clockwise, quiet ground first).
# Outputs use bidirectional (no dedicated output io_type in Chipathon schema).
# done/error are in STATUS register (CPU-readable), not package pins.
#
# Signoff: docs/signoff_a02_macro/README.md
# ======================================================
pins:
  # Quiet ground first (fixed down-bond per quadrant)
  - name: VSS
    io_type: ground
  # Power paired with the ground above
  - name: VDD
    io_type: power
  - name: clk
    io_type: input_cmos
  - name: "data[7]"
    io_type: bidirectional
  - name: "data[5]"
    io_type: bidirectional
  - name: "data[6]"
    io_type: bidirectional
  - name: "data[4]"
    io_type: bidirectional
  - name: "data[0]"
    io_type: bidirectional
  - name: "data[1]"
    io_type: bidirectional
  - name: "data[2]"
    io_type: bidirectional
  - name: "data[3]"
    io_type: bidirectional
  - name: "addr[0]"
    io_type: input_cmos
  - name: "addr[1]"
    io_type: input_cmos
  - name: "addr[2]"
    io_type: input_cmos
  - name: "addr[3]"
    io_type: input_cmos
  - name: irq
    io_type: bidirectional
  - name: re
    io_type: input_cmos
  - name: "debug_state[0]"
    io_type: bidirectional
  - name: "debug_state[2]"
    io_type: bidirectional
  - name: "debug_state[1]"
    io_type: bidirectional
  - name: we
    io_type: input_cmos
  - name: rst_n
    io_type: input_schmitt
