# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "A Reconfigurable AI and Mathematical Expression Accelerator for Edge Inference"
  team: "AI_Byte"                 # update if the official team name differs
  discord: ""                     # optional Discord handle
  description: >
    Lightweight edge AI / math accelerator (systolic CNN tiles,
    Q8.8 ALU, EML elementary functions) with 8-bit host MMIF on GF180MCU.
  # Relative path from repository root:
  lvs_config: "lvs_config.json"

# ======================================================
# External pad connections (organizer DEF / padframe integrate)
# ======================================================
# Names must match top pins in the layout (ai_byte_top LEF/GDS text).
# Layout already exposes VDD + VSS from the core PDN.
#
# Mitch (2026-08): no common padframe ground — each power needs a
# paired ground pad. First quadrant pin is the fixed down-bonded
# quiet ground; list that ground first.
#
# Order after supplies: UL quadrant clockwise bottom-left →
# upper-right, aligned with core edges for shorter routes
# (clk west, then north-edge signals west→east).
#
# Outputs use bidirectional (no dedicated output io_type).
# done/error stay CPU-readable in STATUS (not pads).
# 22 pins: VSS + VDD + 20 digital (Block A budget ≤22).
# ======================================================
pins:
  # Quiet ground first (fixed down-bond per quadrant)
  - name: VSS
    io_type: ground
  # Power paired with the ground above
  - name: VDD
    io_type: power
  - name: clk
    io_type: input_cmos
  - name: "data[7]"
    io_type: bidirectional
  - name: "data[5]"
    io_type: bidirectional
  - name: "data[6]"
    io_type: bidirectional
  - name: "data[4]"
    io_type: bidirectional
  - name: "data[0]"
    io_type: bidirectional
  - name: "data[1]"
    io_type: bidirectional
  - name: "data[2]"
    io_type: bidirectional
  - name: "data[3]"
    io_type: bidirectional
  - name: "addr[0]"
    io_type: input_cmos
  - name: "addr[1]"
    io_type: input_cmos
  - name: "addr[2]"
    io_type: input_cmos
  - name: "addr[3]"
    io_type: input_cmos
  - name: irq
    io_type: bidirectional
  - name: re
    io_type: input_cmos
  - name: "debug_state[0]"
    io_type: bidirectional
  - name: "debug_state[2]"
    io_type: bidirectional
  - name: "debug_state[1]"
    io_type: bidirectional
  - name: we
    io_type: input_cmos
  - name: rst_n
    io_type: input_schmitt
